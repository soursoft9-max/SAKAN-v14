/* =============================================
   نظام سَكَن | تنسيقات الخدمات الإضافية
   مبنية على ألوان style.css (الكحلي والذهبي والعاجي)
   ============================================= */
:root {
  --navy: #17243A; --navy-light: #263852; --gold: #C6A45B; --gold-light: #E7D5A5;
  --ivory: #F8F5ED; --white: #FFFEFA; --text: #263044; --muted: #727887; --border: #E8E0D0;
  --sk-good: #1f7a46; --sk-good-bg: #e3f3e9;
  --sk-warn: #8a5a00; --sk-warn-bg: #fbefd6;
  --sk-bad: #a8322a; --sk-bad-bg: #fbe4e1;
  --sk-info: #1f4f8f; --sk-info-bg: #e3ecf8;
}

.sk-page { max-width: 1100px; margin: 0 auto; padding: 28px 18px 60px; display: flex; flex-direction: column; gap: 22px; }
.sk-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.sk-head h1 { margin: 0; color: var(--navy); font-size: 1.7rem; }
.sk-head p { margin: 4px 0 0; color: var(--muted); }

.sk-card { background: var(--white); border: 1px solid var(--border); border-radius: 18px; padding: 22px; box-shadow: 0 10px 28px #17243A0d; }
.sk-card > h2 { margin: 0 0 14px; color: var(--navy); font-size: 1.2rem; }
.sk-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 800px) { .sk-grid2 { grid-template-columns: 1fr; } }

.sk-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.sk-stat { background: var(--white); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
.sk-stat strong { display: block; font-size: 1.7rem; color: var(--navy); font-variant-numeric: tabular-nums; }
.sk-stat span { color: var(--muted); font-size: .9rem; }

.sk-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 18px; border-radius: 12px; border: 1px solid var(--border); background: var(--white); color: var(--navy); font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; }
.sk-btn:hover { border-color: var(--gold); }
.sk-btn.primary { background: var(--navy); color: var(--white); border-color: var(--navy); }
.sk-btn.primary:hover { background: var(--navy-light); }
.sk-btn.gold { background: var(--gold); color: var(--navy); border-color: var(--gold); }
.sk-btn.good { background: var(--sk-good-bg); color: var(--sk-good); border-color: transparent; }
.sk-btn.bad { background: var(--sk-bad-bg); color: var(--sk-bad); border-color: transparent; }
.sk-btn.sm { padding: 6px 12px; font-size: .88rem; border-radius: 10px; }
.sk-btn:disabled { opacity: .55; cursor: default; }
.sk-btn:focus-visible, .sk-form input:focus-visible, .sk-form select:focus-visible, .sk-form textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.sk-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.sk-pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 11px; border-radius: 99px; font-size: .8rem; font-weight: 700; white-space: nowrap; }
.sk-pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.sk-good { background: var(--sk-good-bg); color: var(--sk-good); }
.sk-warn { background: var(--sk-warn-bg); color: var(--sk-warn); }
.sk-bad { background: var(--sk-bad-bg); color: var(--sk-bad); }
.sk-info { background: var(--sk-info-bg); color: var(--sk-info); }
.sk-muted { background: var(--ivory); color: var(--muted); }

.sk-steps { list-style: none; display: flex; flex-wrap: wrap; gap: 4px; padding: 0; margin: 10px 0 0; }
.sk-steps li { font-size: .78rem; padding: 3px 10px; border-radius: 6px; background: var(--ivory); color: var(--muted); }
.sk-steps li.done { background: var(--navy); color: var(--white); }
.sk-steps li.now { background: var(--gold-light); color: var(--navy); }
.sk-steps li.bad { background: var(--sk-bad-bg); color: var(--sk-bad); }

.sk-list { display: flex; flex-direction: column; gap: 14px; }
.sk-req { border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; background: var(--white); display: flex; flex-direction: column; gap: 10px; }
.sk-req-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
.sk-req h3 { margin: 0; color: var(--navy); font-size: 1.05rem; }
.sk-kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 18px; margin: 0; }
.sk-kv dt { color: var(--muted); font-size: .82rem; }
.sk-kv dd { margin: 0; color: var(--text); overflow-wrap: anywhere; }
.sk-num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: embed; }
.sk-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-top: 1px dashed var(--border); padding-top: 12px; }
.sk-actions textarea { flex: 1 1 260px; min-height: 42px; border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; font: inherit; background: var(--ivory); }

.sk-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 240px)); gap: 12px; }
.sk-cards figure { margin: 0; display: flex; flex-direction: column; gap: 4px; }
.sk-cards img { width: 100%; aspect-ratio: 1.586; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); background: var(--ivory); }
.sk-cards figcaption { font-size: .8rem; color: var(--muted); }
.sk-cards figure.sk-missing figcaption::after { content: " (تعذّر عرض الصورة)"; }

.sk-form { display: flex; flex-direction: column; gap: 14px; }
.sk-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 640px) { .sk-fields { grid-template-columns: 1fr; } }
.sk-form label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; color: var(--navy); font-size: .92rem; min-width: 0; }
.sk-form input, .sk-form select, .sk-form textarea { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font: inherit; color: var(--text); background: var(--ivory); width: 100%; min-width: 0; }
.sk-form textarea { min-height: 80px; resize: vertical; }
.sk-seg { display: inline-flex; background: var(--ivory); border: 1px solid var(--border); border-radius: 12px; padding: 4px; gap: 4px; }
.sk-seg button { border: 0; background: transparent; padding: 8px 14px; border-radius: 9px; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer; }
.sk-seg button[aria-pressed="true"] { background: var(--navy); color: var(--white); }

.sk-msg { margin: 0; font-weight: 600; }
.sk-msg:empty { display: none; }
.sk-msg[data-type="error"] { color: var(--sk-bad); }
.sk-msg[data-type="success"] { color: var(--sk-good); }
.sk-msg[data-type="info"] { color: var(--sk-info); }
.sk-empty { color: var(--muted); text-align: center; padding: 24px 8px; }
.sk-note { background: var(--ivory); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; color: var(--text); font-size: .92rem; }

.sk-table-wrap { overflow-x: auto; }
.sk-table { width: 100%; border-collapse: collapse; font-size: .93rem; }
.sk-table th, .sk-table td { text-align: start; padding: 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.sk-table th { color: var(--muted); font-size: .82rem; font-weight: 700; }

.sk-today { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
.sk-today .state { font-size: 1.35rem; font-weight: 800; color: var(--navy); }
.sk-twostep { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
@media (max-width: 560px) { .sk-twostep { grid-template-columns: 1fr; } }
.sk-twostep div { border: 1.5px dashed var(--border); border-radius: 14px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; }
.sk-twostep b { display: block; color: var(--navy); }
.sk-twostep i { font-style: normal; width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--ivory); color: var(--muted); font-weight: 800; }
.sk-twostep .done { border-style: solid; border-color: var(--gold); background: #c6a45b14; }
.sk-twostep .done i { background: var(--navy); color: var(--white); }

.sk-occ { display: inline-block; width: 80px; height: 6px; border-radius: 3px; background: var(--ivory); overflow: hidden; vertical-align: middle; margin-inline-end: 6px; }
.sk-occ span { display: block; height: 100%; background: var(--navy); }
.sk-occ span.full { background: var(--gold); }

/* زر الخروج في رأس الصفحات الجديدة */
#sk-logout { background: transparent; color: var(--white); border: 1px solid var(--gold); border-radius: 10px; padding: 8px 16px; font: inherit; font-weight: 600; cursor: pointer; }
#sk-logout:hover { background: #ffffff14; }

/* =============================================
   الإطار الموحّد لكل الصفحات الداخلية
   ============================================= */
body.sk-body { margin: 0; background: var(--ivory); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
body.sk-body > .sk-page { flex: 1; width: 100%; }
.sk-topbar .brand { text-decoration: none; color: inherit; }
.sk-who { color: var(--gold-light); font-weight: 600; font-size: .92rem; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sk-nav { background: var(--white); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
.sk-nav-inner { max-width: 1100px; margin: 0 auto; padding: 0 18px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.sk-nav-inner::-webkit-scrollbar { display: none; }
.sk-nav a { flex: none; padding: 14px 14px 12px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: .95rem; border-bottom: 3px solid transparent; white-space: nowrap; }
.sk-nav a:hover { color: var(--navy); }
.sk-nav a[aria-current="page"] { color: var(--navy); border-bottom-color: var(--gold); }
.sk-seg button.active { background: var(--navy); color: var(--white); }
.sk-seg { flex-wrap: wrap; }
.sk-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.sk-tile { display: flex; flex-direction: column; gap: 6px; padding: 20px; background: var(--white); border: 1px solid var(--border); border-radius: 18px; text-decoration: none; color: var(--text); transition: border-color .15s, transform .15s; }
.sk-tile:hover { border-color: var(--gold); transform: translateY(-2px); }
.sk-tile h3 { margin: 0; color: var(--navy); font-size: 1.05rem; }
.sk-tile p { margin: 0; color: var(--muted); font-size: .9rem; }
.sk-tile .sk-ico { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--ivory); border: 1px solid var(--border); font-size: 1.2rem; }
a.sk-stat { text-decoration: none; }
a.sk-stat:hover { border-color: var(--gold); }
.sk-search { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font: inherit; background: var(--ivory); width: 100%; max-width: 360px; }
.primary-button { display: inline-flex; align-items: center; padding: 6px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--white); color: var(--navy); font: inherit; font-size: .88rem; font-weight: 600; cursor: pointer; text-decoration: none; margin-inline-end: 4px; }
.primary-button:hover { border-color: var(--gold); }
@media (prefers-reduced-motion: reduce) { .sk-tile { transition: none; } .sk-tile:hover { transform: none; } }
@media (max-width: 640px) {
  .sk-topbar .header-actions { gap: 8px; }
  .sk-who { display: none; }
  .sk-head h1 { font-size: 1.4rem; }
}
#admin-auth-message[data-type="success"] { display: none; }

/* عنصر مخفي يبقى مخفياً مهما كان تنسيقه */
[hidden] { display: none !important; }

  </style>
  <style id="sk-style-mobile">
/* =============================================
   نظام سَكَن | تنسيق صفحات الجوال
   شريط علوي ثابت، محتوى بطاقات، وشريط أزرار سفلي
   ============================================= */
.m-body {
  margin: 0; min-height: 100vh; background: var(--ivory); color: var(--text);
  font-family: "Cairo", Tahoma, system-ui, sans-serif; font-size: 16px; line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
  padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px));
}
.m-body * { box-sizing: border-box; }

/* الشريط العلوي */
.m-top {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px;
  background: var(--navy); color: var(--white);
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) 10px max(14px, env(safe-area-inset-left, 0px));
  border-bottom: 2px solid var(--gold);
}
.m-top img { width: 38px; height: 38px; border-radius: 10px; background: var(--white); object-fit: contain; flex: none; }
.m-top .m-brand { flex: 1; min-width: 0; }
.m-top .m-brand b { display: block; font-size: 1.05rem; line-height: 1.2; }
.m-top .m-brand small { color: var(--gold-light); font-size: .78rem; }
.m-top a, .m-top button { color: var(--white); }
.m-who { max-width: 38vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .85rem; text-decoration: none; color: var(--gold-light) !important; }
.m-icon-btn { border: 1px solid #ffffff40; background: transparent; border-radius: 10px; width: 38px; height: 38px; display: grid; place-items: center; cursor: pointer; flex: none; }
.m-icon-btn svg { width: 20px; height: 20px; }

.m-main { padding: 14px max(14px, env(safe-area-inset-right, 0px)) 24px max(14px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; max-width: 640px; margin: 0 auto; }
.m-view { display: flex; flex-direction: column; gap: 14px; }
.m-h1 { margin: 2px 0 0; font-size: 1.3rem; color: var(--navy); }
.m-sub { color: var(--muted); font-size: .82rem; display: block; }
.m-text { margin: 6px 0 0; }
.m-empty { color: var(--muted); text-align: center; padding: 28px 10px; margin: 0; }
.m-note { color: var(--muted); font-size: .85rem; margin: 8px 0 0; }

/* البطاقات */
.m-card { background: var(--white); border: 1px solid var(--border); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.m-card > summary { list-style: none; cursor: pointer; }
.m-card > summary::-webkit-details-marker { display: none; }
.m-card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.m-card-head h3 { margin: 0; font-size: 1.02rem; color: var(--navy); }
.m-unread { border-inline-start: 4px solid var(--gold); }
.m-more summary { cursor: pointer; color: var(--navy); font-weight: 700; font-size: .9rem; padding: 4px 0; }
.m-more .sk-kv { grid-template-columns: 1fr; margin-top: 6px; }
.m-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.m-row:last-child { border-bottom: 0; }
.m-row > div { min-width: 0; }

/* الحضور */
.m-hero { background: var(--navy); color: var(--white); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 8px; }
.m-hero .m-day { color: var(--gold-light); font-size: .85rem; }
.m-hero .m-state { font-size: 1.3rem; font-weight: 800; }
.m-hero .m-note { color: #ffffffb3; }
.m-steps2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.m-steps2 span { border: 1px dashed #ffffff55; border-radius: 10px; padding: 8px; font-size: .85rem; text-align: center; }
.m-steps2 span.done { background: var(--gold); color: var(--navy); border-color: var(--gold); font-weight: 700; }

/* أرقام */
.m-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.m-stats > div { background: var(--white); border: 1px solid var(--border); border-radius: 14px; padding: 12px 8px; text-align: center; }
.m-stats b { display: block; font-size: 1.5rem; color: var(--navy); font-variant-numeric: tabular-nums; }
.m-stats span { font-size: .78rem; color: var(--muted); }

/* الأزرار والحقول */
.m-btn { min-height: 46px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--white); color: var(--navy); font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; text-align: center; }
.m-btn.primary { background: var(--navy); color: var(--white); border-color: var(--navy); }
.m-btn.gold { background: var(--gold); color: var(--navy); border-color: var(--gold); }
.m-btn.good { background: var(--sk-good-bg); color: var(--sk-good); border-color: transparent; }
.m-btn.bad { background: var(--sk-bad-bg); color: var(--sk-bad); border-color: transparent; }
.m-btn:disabled { opacity: .55; }
.m-btn:focus-visible, .m-input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.m-wide { width: 100%; }
.m-actions { display: grid; gap: 8px; border-top: 1px dashed var(--border); padding-top: 10px; }
.m-input, .m-body .form-group input, .m-body .form-group select, .m-body .form-group textarea, .m-form input, .m-form select, .m-form textarea {
  width: 100%; min-height: 46px; border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font: inherit; background: var(--ivory); color: var(--text);
}
.m-form { display: flex; flex-direction: column; gap: 12px; }
.m-form label, .m-body .form-group label { display: flex; flex-direction: column; gap: 6px; font-weight: 700; color: var(--navy); font-size: .92rem; }
.m-body .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.m-body .document-section { background: var(--white); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
.m-body .document-section h3 { margin: 0 0 10px; color: var(--navy); font-size: 1rem; }
.m-body #leave-request-form .service-button, .m-body #leave-request-form button[type=button] {
  width: 100%; min-height: 46px; border-radius: 12px; border: 1px solid var(--navy); background: var(--white); color: var(--navy); font: inherit; font-weight: 700; margin-top: 6px;
}
.m-body #leave-request-form [type=submit] { background: var(--navy); color: var(--white); }
.m-body #submit-request-message[data-type="error"] { color: var(--sk-bad); font-weight: 700; }
.m-body #submit-request-message[data-type="success"] { color: var(--sk-good); font-weight: 700; }
.m-body #submit-request-message[data-type="info"] { color: var(--sk-info); font-weight: 700; }
.m-chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.m-chips::-webkit-scrollbar { display: none; }
.m-chips button, .m-chips a { flex: none; text-decoration: none; border: 1px solid var(--border); background: var(--white); color: var(--muted); border-radius: 99px; padding: 8px 14px; font: inherit; font-weight: 700; font-size: .88rem; cursor: pointer; }
.m-chips button[aria-pressed="true"], .m-chips a[aria-current="page"] { background: var(--navy); border-color: var(--navy); color: var(--white); }
.m-chips b { font-variant-numeric: tabular-nums; margin-inline-start: 4px; }

/* شريط الأزرار السفلي */
.m-tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; display: flex;
  background: var(--white); border-top: 1px solid var(--border); box-shadow: 0 -6px 20px #17243A14;
  padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px));
}
.m-tabs button, .m-tabs a { flex: 1; text-decoration: none; min-width: 0; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: .72rem; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 12px; cursor: pointer; position: relative; }
.m-tabs svg { width: 24px; height: 24px; }
.m-tabs button[aria-current="page"], .m-tabs a[aria-current="page"] { color: var(--navy); background: #c6a45b22; }
.m-tabs span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.m-badge { position: absolute; top: 2px; inset-inline-end: 18%; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--sk-bad); color: #fff; font-size: .68rem; line-height: 18px; text-align: center; }

#m-toast { position: fixed; z-index: 40; left: 14px; right: 14px; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); margin: 0 auto; max-width: 520px; background: var(--navy); color: var(--white); padding: 12px 16px; border-radius: 14px; font-weight: 700; box-shadow: 0 10px 30px #0004; }
#m-toast[data-type="error"] { background: var(--sk-bad); }
#m-toast[data-type="success"] { background: var(--sk-good); }
.m-desktop { text-align: center; font-size: .82rem; }
.m-desktop a { color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .m-view:not([hidden]) { animation: m-in .18s ease-out; } }
@keyframes m-in { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* صفحات الطالبة المستقلة */
.m-back svg { width: 22px; height: 22px; }
.m-hero-link { text-decoration: none; }
.m-hero-link::after { content: "فتح صفحة الحضور ←"; color: var(--gold-light); font-size: .82rem; font-weight: 700; }
.m-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.m-tile { background: var(--white); border: 1px solid var(--border); border-radius: 16px; padding: 14px 12px; min-height: 112px; display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: var(--navy); }
.m-tile svg { width: 28px; height: 28px; color: var(--gold); margin-bottom: 4px; }
.m-tile b { font-size: .98rem; line-height: 1.35; }
.m-tile span { color: var(--muted); font-size: .78rem; }
.m-tile:active { background: #c6a45b1a; }
.m-flow { margin: 4px 0 0; padding-inline-start: 22px; color: var(--muted); font-size: .88rem; display: grid; gap: 2px; }
.m-warn { color: var(--sk-bad) !important; font-weight: 700; }

  </style>
