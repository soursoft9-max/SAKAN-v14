  <title>موافقة ولي الأمر | سَكَن</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
  <style>
    :root { --navy:#17243A; --gold:#C6A45B; --gold-light:#E4CF9C; --ivory:#F8F5ED; --white:#fff; --text:#1F2937; --muted:#6B7280; --border:#E5DFD0;
             --good:#166534; --good-bg:#DCFCE7; --bad:#991B1B; --bad-bg:#FEE2E2; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:var(--ivory); color:var(--text); font-family:"Cairo",Tahoma,system-ui,sans-serif; font-size:17px; line-height:1.7; }
    header { background:var(--navy); color:var(--white); border-bottom:2px solid var(--gold); padding:14px 16px; display:flex; gap:12px; align-items:center; }
    header img { width:44px; height:44px; border-radius:12px; background:#fff; object-fit:contain; }
    header b { display:block; font-size:1.15rem; line-height:1.2; }
    header small { color:var(--gold-light); }
    main { max-width:560px; margin:0 auto; padding:18px 16px 40px; }
    #g-box { background:var(--white); border:1px solid var(--border); border-radius:18px; padding:18px; }
    #g-box p { margin:0 0 10px; }
    .g-hello { font-weight:700; color:var(--navy); }
    .g-who { background:var(--ivory); border-radius:14px; padding:12px 14px; margin:6px 0 12px; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    .g-who b { color:var(--navy); font-size:1.1rem; }
    .g-who span { color:var(--muted); }
    .g-kv { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; margin:0 0 14px; }
    .g-kv dt { color:var(--muted); }
    .g-kv dd { margin:0; font-weight:600; }
    .g-q { font-weight:800; color:var(--navy); font-size:1.1rem; }
    .g-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .g-btn { min-height:56px; border-radius:14px; border:0; font:inherit; font-size:1.1rem; font-weight:800; cursor:pointer; }
    .g-btn.good { background:var(--good); color:#fff; }
    .g-btn.bad { background:var(--bad-bg); color:var(--bad); }
    .g-btn:disabled { opacity:.55; }
    .g-btn:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
    .g-msg { color:var(--muted); text-align:center; }
    .g-result { text-align:center; padding:12px 0; }
    .g-result b { display:block; font-size:1.35rem; }
    .g-result.good b { color:var(--good); }
    .g-result.bad b { color:var(--bad); }
    [hidden] { display:none !important; }
    footer { text-align:center; color:var(--muted); font-size:.8rem; margin-top:16px; }
  </style>
</head>
