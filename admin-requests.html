<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17243A">
  <title>الطلبات | سَكَن</title>
  <style id="sk-style-base">

@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');

:root {
  --navy: #17243A;
  --navy-dark: #0E1728;
  --navy-light: #263852;
  --gold: #C6A45B;
  --gold-light: #E7D5A5;
  --ivory: #F8F5ED;
  --white: #FFFEFA;
  --text: #263044;
  --muted: #727887;
  --border: #E8E0D0;
  --shadow: 0 12px 32px #17243A10;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  scroll-behavior: smooth;
  scroll-padding-top: 25px;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Cairo', Tahoma, sans-serif;
  background:
    radial-gradient(ellipse at top, #FFFFFF 0%, transparent 60%),
    var(--ivory);
  color: var(--text);
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  font-family: inherit;
}

/* الشريط العلوي */

.topbar {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 15px 7%;
  background: var(--navy-dark);
  color: var(--white);
  border-bottom: 3px solid var(--gold);
  box-shadow: 0 5px 20px #0E17281A;
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
}

.logo {
  width: 66px;
  height: 66px;
  flex-shrink: 0;
  display: block;
  object-fit: contain;
  padding: 3px;
  border: 2px solid var(--gold);
  border-radius: 15px;
  background: var(--ivory);
}

.brand-text {
  min-width: 0;
}

.brand h2 {
  margin: 0;
  color: var(--white);
  font-size: 22px;
  font-weight: 800;
}

.brand h2 span {
  margin-right: 8px;
  color: var(--gold);
  font-size: 12px;
  letter-spacing: 2px;
}

.brand p {
  margin: 3px 0 0;
  color: #D5D9E1;
  font-size: 12px;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.status {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 13px;
  border: 1px solid #C6A45B80;
  border-radius: 30px;
  color: var(--gold-light);
  font-size: 12px;
  white-space: nowrap;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--gold);
}

.login-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 40px;
  padding: 8px 17px;
  border: 1px solid var(--gold);
  border-radius: 9px;
  color: var(--gold-light);
  font-size: 13px;
  font-weight: 700;
  transition: background 0.2s, color 0.2s;
}

.login-link:hover {
  background: var(--gold);
  color: var(--navy-dark);
}

/* مساحة المحتوى */

.container {
  width: min(1120px, 90%);
  margin: auto;
}

/* الواجهة الترحيبية */

.welcome {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 25px;
  min-height: 290px;
  margin-top: 32px;
  padding: 42px 38px;
  border: 1px solid #C6A45B65;
  border-radius: 23px;
  background: linear-gradient(
    125deg,
    var(--navy-dark),
    var(--navy),
    var(--navy-light)
  );
  color: var(--white);
  box-shadow: 0 16px 38px #17243A20;
}

.welcome::after {
  content: "سَكَن";
  position: absolute;
  z-index: -1;
  left: 20px;
  bottom: -48px;
  color: #FFFFFF0A;
  font-size: clamp(100px, 15vw, 170px);
  font-weight: 800;
  pointer-events: none;
}

.welcome-content {
  max-width: 680px;
}

.welcome-label,
.section-label {
  display: inline-block;
  margin-bottom: 10px;
  color: var(--gold);
  font-size: 13px;
  font-weight: 700;
}

.welcome h1 {
  margin: 0;
  color: var(--white);
  font-size: clamp(27px, 4vw, 40px);
  line-height: 1.7;
}

.welcome-content > p {
  max-width: 600px;
  margin: 10px 0 22px;
  color: #E0E4EB;
  font-size: 14px;
  line-height: 2;
}

.primary-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 13px;
  min-height: 46px;
  padding: 11px 20px;
  border: 1px solid var(--gold);
  border-radius: 10px;
  background: var(--gold);
  color: var(--navy-dark);
  font-size: 14px;
  font-weight: 800;
  transition: transform 0.2s, background 0.2s;
}

.primary-link:hover {
  transform: translateY(-2px);
  background: var(--gold-light);
}

.primary-link span {
  font-size: 20px;
}

.welcome-decoration {
  display: grid;
  flex-shrink: 0;
  place-items: center;
  width: 205px;
  height: 205px;
  border: 1px solid #C6A45B55;
  border-radius: 50%;
  background: #FFFFFF05;
}

.decoration-ring {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 165px;
  height: 165px;
  border: 2px solid var(--gold);
  border-radius: 50%;
  outline: 1px solid #C6A45B60;
  outline-offset: 7px;
}

.decoration-symbol {
  color: var(--gold-light);
  font-size: 36px;
  font-weight: 800;
}

.decoration-caption {
  margin-top: 4px;
  color: #E0E4EB;
  font-size: 12px;
  letter-spacing: 4px;
}

/* عنوان الخدمات */

.services {
  padding: 38px 0;
}

.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  margin-bottom: 24px;
}

.section-heading h2 {
  margin: 0;
  color: var(--navy);
  font-size: 25px;
}

.section-label {
  margin-bottom: 5px;
}

.section-intro {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.9;
}

.service-count {
  padding: 8px 13px;
  border: 1px solid var(--border);
  border-radius: 30px;
  background: var(--white);
  color: var(--navy);
  font-size: 12px;
  white-space: nowrap;
}

/* بطاقات الخدمات */

.service-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 20px;
}

.service-card {
  min-width: 0;
  padding: 24px;
  border: 1px solid var(--border);
  border-radius: 17px;
  background: var(--white);
  box-shadow: 0 5px 18px #17243A07;
  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease,
    border-color 0.2s ease;
}

.service-card:hover {
  transform: translateY(-4px);
  border-color: #C6A45B99;
  box-shadow: var(--shadow);
}

.service-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.service-icon {
  width: 50px;
  height: 50px;
  display: grid;
  place-items: center;
  border: 1px solid #C6A45B75;
  border-radius: 14px;
  background: #F4EBD5;
  color: var(--navy);
  font-size: 27px;
  font-weight: 700;
}

.card-number {
  color: #B9AD96;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
}

.service-card h3 {
  margin: 17px 0 8px;
  color: var(--navy);
  font-size: 18px;
}

.service-card p {
  min-height: 76px;
  margin: 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 2;
}

.service-button {
  width: 100%;
  min-height: 43px;
  margin-top: 18px;
  padding: 10px;
  border: 1px solid #E4D8BB;
  border-radius: 9px;
  background: #F5F0E4;
  color: #75613B;
  font-size: 13px;
  font-weight: 700;
  cursor: not-allowed;
  opacity: 1;
}

/* تنبيه الخصوصية */

.security-note {
  display: flex;
  align-items: center;
  gap: 17px;
  margin: 0 0 35px;
  padding: 22px 24px;
  border: 1px solid #C6A45B70;
  border-radius: 15px;
  background: #F1EADB;
}

.security-icon {
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  flex-shrink: 0;
  border: 1px solid #C6A45B80;
  border-radius: 12px;
  background: var(--white);
  color: var(--navy);
  font-size: 25px;
}

.security-note h2 {
  margin: 0 0 5px;
  color: var(--navy);
  font-size: 16px;
}

.security-note p {
  margin: 0;
  color: #676D78;
  font-size: 13px;
  line-height: 1.9;
}

/* التذييل */

.footer {
  padding: 22px 0;
  border-top: 1px solid var(--border);
  color: var(--muted);
  text-align: center;
  font-size: 12px;
  line-height: 1.9;
}

.footer-brand {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 9px;
  color: var(--navy);
  font-weight: 700;
}

.footer-divider {
  color: var(--gold);
}

.footer > p {
  margin: 5px 0 0;
}

/* الشاشات المتوسطة */

@media (max-width: 900px) {
  .topbar {
    padding-right: 5%;
    padding-left: 5%;
  }

  .welcome-decoration {
    width: 155px;
    height: 155px;
  }

  .decoration-ring {
    width: 122px;
    height: 122px;
  }

  .decoration-symbol {
    font-size: 29px;
  }

  .service-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* الهواتف */

@media (max-width: 600px) {
  .topbar {
    align-items: center;
    padding: 13px 4%;
    gap: 10px;
  }

  .brand {
    gap: 9px;
  }

  .logo {
    width: 49px;
    height: 49px;
    border-radius: 12px;
  }

  .brand h2 {
    font-size: 18px;
  }

  .brand h2 span {
    margin-right: 4px;
    font-size: 10px;
  }

  .brand p {
    max-width: 190px;
    font-size: 10px;
  }

  .header-actions {
    gap: 0;
  }

  .status {
    display: none;
  }

  .login-link {
    min-height: 36px;
    padding: 7px 10px;
    font-size: 11px;
  }

  .container {
    width: 92%;
  }

  .welcome {
    min-height: auto;
    margin-top: 20px;
    padding: 28px 21px;
    border-radius: 17px;
  }

  .welcome-decoration {
    display: none;
  }

  .welcome h1 {
    font-size: 27px;
    line-height: 1.7;
  }

  .welcome-content > p {
    font-size: 13px;
  }

  .services {
    padding: 30px 0;
  }

  .section-heading {
    align-items: flex-start;
  }

  .section-heading h2 {
    font-size: 22px;
  }

  .section-intro {
    font-size: 12px;
  }

  .service-count {
    padding: 6px 9px;
    font-size: 11px;
  }

  .service-grid {
    grid-template-columns: 1fr;
    gap: 14px;
  }

  .service-card {
    padding: 20px;
  }

  .service-card p {
    min-height: auto;
  }

  .security-note {
    align-items: flex-start;
    gap: 12px;
    padding: 17px;
  }

  .security-note h2 {
    font-size: 14px;
  }

  .security-note p {
    font-size: 12px;
  }

  .footer-brand {
    gap: 6px;
    font-size: 11px;
  }
}

/* تقليل الحركة لمن يفضل ذلك */

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  *,
  *::before,
  *::after {
    transition-duration: 0.01ms !important;
  }
}

/* =====================================
   SAKAN | تنسيق بوابة تسجيل الدخول
   ===================================== */

.auth-section {
  padding: 70px 20px;
  background:
    radial-gradient(ellipse at top, rgba(198, 164, 91, 0.10), transparent 60%),
    var(--ivory);
}

.auth-card {
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
  padding: 38px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 24px;
  box-shadow: 0 18px 55px rgba(14, 23, 40, 0.09);
}

.auth-card > .section-label {
  display: inline-block;
  margin-bottom: 12px;
  color: var(--gold);
  font-weight: 700;
  letter-spacing: 0.4px;
}

.auth-card h2 {
  margin: 0 0 12px;
  color: var(--navy);
  font-size: 30px;
  font-weight: 800;
}

.auth-card h3 {
  margin: 0 0 10px;
  color: var(--navy);
  font-size: 21px;
}

.auth-card > p,
.auth-card form p {
  color: var(--muted);
  line-height: 1.9;
}

.auth-card form {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 24px;
}

.auth-card label {
  margin-top: 8px;
  color: var(--navy);
  font-size: 14px;
  font-weight: 700;
}

.auth-card input {
  width: 100%;
  min-height: 50px;
  padding: 13px 15px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #fffefa;
  color: var(--text);
  font: inherit;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.auth-card input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 4px rgba(198, 164, 91, 0.15);
}

.auth-card input::placeholder {
  color: #a0a3ab;
}

.auth-submit {
  width: 100%;
  min-height: 51px;
  margin-top: 12px;
  padding: 13px 18px;
  border: 1px solid var(--gold);
  border-radius: 12px;
  background: var(--navy);
  color: var(--white);
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s, transform 0.2s;
}

.auth-submit:hover {
  background: var(--navy-light);
  transform: translateY(-1px);
}

.auth-submit:focus-visible {
  outline: 3px solid var(--gold-light);
  outline-offset: 3px;
}

.auth-divider {
  height: 1px;
  margin: 34px 0;
  background: var(--border);
}

#auth-message,
#signup-message {
  min-height: 0;
  margin: 0;
  font-size: 14px;
}

@media (max-width: 600px) {
  .auth-section {
    padding: 42px 16px;
  }

  .auth-card {
    padding: 25px 20px;
    border-radius: 18px;
  }

  .auth-card h2 {
    font-size: 26px;
  }
}

/* صفحات تسجيل الدخول وإنشاء الحساب في سَكَن */
.auth-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px 16px;
  background:
    radial-gradient(circle at top right, #263852 0, transparent 45%),
    #0E1728;
  font-family: "Cairo", sans-serif;
}

.auth-card {
  width: 100%;
  max-width: 460px;
  padding: 32px;
  background: #FFFEFA;
  border: 1px solid #E8E0D0;
  border-radius: 22px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.22);
}

.auth-back {
  display: inline-block;
  margin-bottom: 22px;
  color: #263852;
  text-decoration: none;
  font-size: 14px;
}

.auth-logo {
  display: block;
  width: 82px;
  height: 82px;
  object-fit: contain;
  margin: 0 auto 12px;
}

.auth-brand {
  text-align: center;
  color: #C6A45B;
  font-weight: 800;
  margin: 0 0 8px;
}

.auth-card h1 {
  color: #17243A;
  font-size: 25px;
  text-align: center;
  margin: 0 0 10px;
}

.auth-description {
  color: #727887;
  text-align: center;
  font-size: 14px;
  line-height: 1.9;
  margin-bottom: 26px;
}

.auth-card form {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.auth-card label {
  color: #263044;
  font-size: 14px;
  font-weight: 700;
}

.auth-card input {
  width: 100%;
  box-sizing: border-box;
  padding: 13px 14px;
  border: 1px solid #E8E0D0;
  border-radius: 10px;
  background: #fff;
  color: #263044;
  font-family: inherit;
  font-size: 14px;
  outline: none;
}

.auth-card input:focus {
  border-color: #C6A45B;
  box-shadow: 0 0 0 3px rgba(198, 164, 91, 0.15);
}

.auth-submit {
  margin-top: 12px;
  padding: 13px;
  border: none;
  border-radius: 10px;
  background: #17243A;
  color: #E7D5A5;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s ease;
}

.auth-submit:hover {
  background: #263852;
}

.auth-submit:disabled {
  opacity: 0.65;
  cursor: wait;
}

.auth-message {
  min-height: 24px;
  margin: 6px 0 0;
  font-size: 13px;
  line-height: 1.8;
  overflow-wrap: anywhere;
}

.auth-switch {
  text-align: center;
  color: #727887;
  font-size: 13px;
  margin-top: 24px;
}

.auth-switch a {
  color: #17243A;
  font-weight: 700;
  text-decoration: none;
}

.auth-switch a:hover,
.auth-back:hover {
  color: #C6A45B;
}

.auth-footer {
  text-align: center;
  color: #727887;
  font-size: 12px;
  margin: 24px 0 0;
}

@media (max-width: 480px) {
  .auth-card {
    padding: 24px 20px;
  }

  .auth-card h1 {
    font-size: 22px;
  }
}

/* تنسيق نموذج تصريح الخروج والاستئذان - سَكَن */

#leave-requests-panel {
  width: 100%;
  max-width: 850px;
  margin: 24px auto;
  padding: 24px;
  background: #ffffff;
  border: 1px solid #dcebe2;
  border-radius: 20px;
  box-shadow: 0 8px 28px rgba(28, 82, 57, 0.08);
  box-sizing: border-box;
  color: #243b30;
}

#leave-requests-panel h3,
#leave-requests-panel h2 {
  color: #205b43;
  margin-top: 0;
  margin-bottom: 22px;
  font-size: 1.4rem;
  line-height: 1.7;
}

#leave-request-form {
  display: flex;
  flex-direction: column;
  gap: 18px;
  width: 100%;
}

#leave-request-form label {
  display: block;
  margin-bottom: 8px;
  color: #315844;
  font-weight: 600;
  font-size: 0.96rem;
}

#leave-request-form input:not([type="file"]),
#leave-request-form select,
#leave-request-form textarea {
  display: block;
  width: 100%;
  min-height: 48px;
  padding: 12px 14px;
  border: 1px solid #d5e4da;
  border-radius: 12px;
  background: #f8fbf8;
  color: #243b30;
  font: inherit;
  box-sizing: border-box;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

#leave-request-form textarea {
  min-height: 115px;
  resize: vertical;
}

#leave-request-form input:focus,
#leave-request-form select:focus,
#leave-request-form textarea:focus {
  outline: none;
  border-color: #72aa88;
  box-shadow: 0 0 0 3px rgba(114, 170, 136, 0.18);
}

#leave-request-form input[type="file"] {
  display: block;
  width: 100%;
  padding: 12px;
  border: 1px dashed #a9cdb5;
  border-radius: 12px;
  background: #f5faf6;
  color: #315844;
  box-sizing: border-box;
  font: inherit;
}

#leave-request-form small {
  display: block;
  margin-top: 7px;
  color: #718278;
  font-size: 0.83rem;
  line-height: 1.7;
}

#leave-request-form button[type="submit"] {
  width: 100%;
  min-height: 50px;
  padding: 13px 20px;
  border: none;
  border-radius: 12px;
  background: #347b55;
  color: #ffffff;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s ease, transform 0.2s ease;
}

#leave-request-form button[type="submit"]:hover {
  background: #286542;
}

#leave-request-form button[type="submit"]:active {
  transform: scale(0.99);
}

#leave-request-form button[type="submit"]:disabled {
  opacity: 0.65;
  cursor: wait;
}

#submit-request-message {
  padding: 12px 14px;
  border-radius: 10px;
  line-height: 1.8;
  overflow-wrap: anywhere;
}

#my-requests-list {
  display: grid;
  gap: 14px;
  margin-top: 22px;
}

#my-requests-list .dashboard-card {
  padding: 16px;

/* =============================================
   نظام سَكَن | تنسيقات الخدمات الإضافية
   مبنية على ألوان style.css (الكحلي والذهبي والعاجي)
   ============================================= */
:root {
  --navy: #17243A; --navy-light: #263852; --gold: #C6A45B; --gold-light: #E7D5A5;
  --ivory: #F8F5ED; --white: #FFFEFA; --text: #263044; --muted: #727887; --border: #E8E0D0;
  --sk-good: #1f7a46; --sk-good-bg: #e3f3e9;
  --sk-warn: #8a5a00; --sk-warn-bg: #fbefd6;

  --sk-info: #1f4f8f; --sk-info-bg: #e3ecf8;
}

.sk-page { max-width: 1100px; margin: 0 auto; padding: 28px 18px 60px; display: flex; flex-direction: column; gap: 22px; }
.sk-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.sk-head h1 { margin: 0; color: var(--navy); font-size: 1.7rem; }
.sk-head p { margin: 4px 0 0; color: var(--muted); }

.sk-card { background: var(--white); border: 1px solid var(--border); border-radius: 18px; padding: 22px; box-shadow: 0 10px 28px #17243A0d; }
.sk-card > h2 { margin: 0 0 14px; color: var(--navy); font-size: 1.2rem; }
.sk-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 800px) { .sk-grid2 { grid-template-columns: 1fr; } }

.sk-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.sk-stat { background: var(--white); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
.sk-stat strong { display: block; font-size: 1.7rem; color: var(--navy); font-variant-numeric: tabular-nums; }
.sk-stat span { color: var(--muted); font-size: .9rem; }

.sk-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 18px; border-radius: 12px; border: 1px solid var(--border); background: var(--white); color: var(--navy); font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; }
.sk-btn:hover { border-color: var(--gold); }
.sk-btn.primary { background: var(--navy); color: var(--white); border-color: var(--navy); }
.sk-btn.primary:hover { background: var(--navy-light); }
.sk-btn.gold { background: var(--gold); color: var(--navy); border-color: var(--gold); }
.sk-btn.good { background: var(--sk-good-bg); color: var(--sk-good); border-color: transparent; }
.sk-btn.bad { background: var(--sk-bad-bg); color: var(--sk-bad); border-color: transparent; }
.sk-btn.sm { padding: 6px 12px; font-size: .88rem; border-radius: 10px; }
.sk-btn:disabled { opacity: .55; cursor: default; }
.sk-btn:focus-visible, .sk-form input:focus-visible, .sk-form select:focus-visible, .sk-form textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.sk-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.sk-pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 11px; border-radius: 99px; font-size: .8rem; font-weight: 700; white-space: nowrap; }
.sk-pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.sk-good { background: var(--sk-good-bg); color: var(--sk-good); }
.sk-warn { background: var(--sk-warn-bg); color: var(--sk-warn); }
.sk-bad { background: var(--sk-bad-bg); color: var(--sk-bad); }
.sk-info { background: var(--sk-info-bg); color: var(--sk-info); }
.sk-muted { background: var(--ivory); color: var(--muted); }

.sk-steps { list-style: none; display: flex; flex-wrap: wrap; gap: 4px; padding: 0; margin: 10px 0 0; }
.sk-steps li { font-size: .78rem; padding: 3px 10px; border-radius: 6px; background: var(--ivory); color: var(--muted); }
.sk-steps li.done { background: var(--navy); color: var(--white); }
.sk-steps li.now { background: var(--gold-light); color: var(--navy); }
.sk-steps li.bad { background: var(--sk-bad-bg); color: var(--sk-bad); }

.sk-list { display: flex; flex-direction: column; gap: 14px; }
.sk-req { border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; background: var(--white); display: flex; flex-direction: column; gap: 10px; }
.sk-req-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
.sk-req h3 { margin: 0; color: var(--navy); font-size: 1.05rem; }
.sk-kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 18px; margin: 0; }
.sk-kv dt { color: var(--muted); font-size: .82rem; }
.sk-kv dd { margin: 0; color: var(--text); overflow-wrap: anywhere; }
.sk-num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: embed; }
.sk-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-top: 1px dashed var(--border); padding-top: 12px; }
.sk-actions textarea { flex: 1 1 260px; min-height: 42px; border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; font: inherit; background: var(--ivory); }

.sk-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 240px)); gap: 12px; }
.sk-cards figure { margin: 0; display: flex; flex-direction: column; gap: 4px; }
.sk-cards img { width: 100%; aspect-ratio: 1.586; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); background: var(--ivory); }
.sk-cards figcaption { font-size: .8rem; color: var(--muted); }
.sk-cards figure.sk-missing figcaption::after { content: " (تعذّر عرض الصورة)"; }

.sk-form { display: flex; flex-direction: column; gap: 14px; }
.sk-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 640px) { .sk-fields { grid-template-columns: 1fr; } }
.sk-form label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; color: var(--navy); font-size: .92rem; min-width: 0; }
.sk-form input, .sk-form select, .sk-form textarea { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font: inherit; color: var(--text); background: var(--ivory); width: 100%; min-width: 0; }
.sk-form textarea { min-height: 80px; resize: vertical; }

.sk-seg button { border: 0; background: transparent; padding: 8px 14px; border-radius: 9px; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer; }
.sk-seg button[aria-pressed="true"] { background: var(--navy); color: var(--white); }

.sk-msg { margin: 0; font-weight: 600; }
.sk-msg:empty { display: none; }
.sk-msg[data-type="error"] { color: var(--sk-bad); }
.sk-msg[data-type="success"] { color: var(--sk-good); }
.sk-msg[data-type="info"] { color: var(--sk-info); }
.sk-empty { color: var(--muted); text-align: center; padding: 24px 8px; }
.sk-note { background: var(--ivory); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; color: var(--text); font-size: .92rem; }

.sk-table-wrap { overflow-x: auto; }
.sk-table { width: 100%; border-collapse: collapse; font-size: .93rem; }
.sk-table th, .sk-table td { text-align: start; padding: 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.sk-table th { color: var(--muted); font-size: .82rem; font-weight: 700; }

.sk-today { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
.sk-today .state { font-size: 1.35rem; font-weight: 800; color: var(--navy); }
.sk-twostep { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
@media (max-width: 560px) { .sk-twostep { grid-template-columns: 1fr; } }
.sk-twostep div { border: 1.5px dashed var(--border); border-radius: 14px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; }
.sk-twostep b { display: block; color: var(--navy); }
.sk-twostep i { font-style: normal; width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--ivory); color: var(--muted); font-weight: 800; }
.sk-twostep .done { border-style: solid; border-color: var(--gold); background: #c6a45b14; }
.sk-twostep .done i { background: var(--navy); color: var(--white); }

.sk-occ { display: inline-block; width: 80px; height: 6px; border-radius: 3px; background: var(--ivory); overflow: hidden; vertical-align: middle; margin-inline-end: 6px; }
.sk-occ span { display: block; height: 100%; background: var(--navy); }
.sk-occ span.full { background: var(--gold); }
